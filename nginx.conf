# Paste these directives INSIDE the BT site's server block.
# Replace existing location / ; keep BT SSL/certificate configuration.
client_max_body_size 60m;
location ^~ /private-data/ { return 404; }
location ^~ /tools/ { return 404; }
location ^~ /manage/ { return 404; }
location = /editor-data { return 404; }
location / {
    proxy_pass http://127.0.0.1:18781;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
