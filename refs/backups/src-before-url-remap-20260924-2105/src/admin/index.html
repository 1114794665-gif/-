<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BYF BOOM · 内容管理后台</title>
<style>
:root{
  --ink:#14171c;--ink2:#22272f;--line:#e2ddd4;--line2:#cfc8bd;--bg:#f6f3ee;--panel:#fff;
  --text:#2c3339;--muted:#6b7280;--brass:#a8802f;--brass-l:#c9a24a;
  --ok:#3b6d11;--warn:#854f0b;--err:#a32d2d;--info:#185fa5;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
a{color:var(--info)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.hide{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink)}
#login .card{background:#fff;border-radius:12px;padding:34px;width:min(400px,92vw)}
#login h1{font-size:20px;margin:0 0 6px}
#login p{color:var(--muted);margin:0 0 20px;font-size:13px}
#login label{display:block;font-weight:600;font-size:12px;margin-bottom:14px}
#login input{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:6px;margin-top:5px}
.err-msg{color:var(--err);font-size:12.5px;min-height:18px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:238px;background:var(--ink);color:#b9c0c8;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{padding:20px 20px 16px;border-bottom:1px solid #2f353d}
.side .logo strong{color:#fff;font-size:15px;letter-spacing:.04em;display:block}
.side .logo span{font-size:11px;color:#7c858e}
.side nav{padding:12px 10px;flex:1;overflow:auto}
.side nav button{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#b9c0c8;
  text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;margin-bottom:2px}
.side nav button:hover{background:#22272f;color:#fff}
.side nav button.on{background:var(--brass);color:#fff}
.side nav .pill{background:rgba(255,255,255,.16);border-radius:999px;padding:1px 8px;font-size:11px}
.pill-mode{display:inline-block;background:#eef2f7;border:1px solid #d5dde6;border-radius:999px;padding:1px 8px;font-size:11px;color:#2c3844;white-space:nowrap}
.side .side-foot{padding:14px 20px;border-top:1px solid #2f353d;font-size:12px}
.side .side-foot a{color:#98a1aa;margin-right:12px}

.main{flex:1;min-width:0;padding:24px 28px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:20px;margin:0}
.topbar .sub{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line2);background:#fff;color:var(--text);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.danger{color:var(--err);border-color:#e3c4c4}
.btn.danger:hover{background:#fcebeb;color:var(--err)}
.btn.sm{padding:5px 10px;font-size:12.5px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi b{display:block;font-size:26px;color:var(--ink);line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}

label.f{display:block;margin-bottom:13px}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:4px}
label.f small{color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=email],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass-l);outline-offset:0}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:8px}
.row input{flex:1}
.hint{font-size:11.5px;color:var(--muted);margin:-6px 0 12px}

table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th,table.list td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.list tr:hover td{background:#faf8f5}
table.list td.actions-cell{white-space:nowrap;text-align:right}
.searchbox{max-width:340px;margin-bottom:14px}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#f1efe8;color:var(--muted)}
.tag.err{background:#fcebeb;color:var(--err)}
.tag.warn{background:#faeeda;color:var(--warn)}
.tag.ok{background:#eaf3de;color:var(--ok)}
.tag.info{background:#e6f1fb;color:var(--info)}
.flash{position:sticky;top:0;z-index:20;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px}
.flash.ok{background:#eaf3de;color:var(--ok)}
.flash.err{background:#fcebeb;color:var(--err)}
.sectioncard{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fdfcfa}
.sectioncard .sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
pre.out{background:var(--ink);color:#d7dde3;padding:14px;border-radius:8px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:340px}
.muted{color:var(--muted);font-size:12.5px}
.warnbox{background:#faeeda;border:1px solid #f0dcae;color:var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.issue-list{list-style:none;padding:0;margin:0;font-size:13px}
.issue-list li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.issue-list code{font-family:var(--mono);font-size:12px;color:var(--muted)}
#img-preview{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.img-thumb{margin:0;width:86px;text-align:center}
.img-thumb img{width:86px;height:86px;object-fit:cover;border:1px solid var(--line);border-radius:6px;display:block;background:#fff}
.img-thumb.main img{outline:2px solid #2e7d4f;outline-offset:-2px}
.img-thumb figcaption{font-size:11px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>

<div id="login">
  <form class="card" id="login-form">
    <h1>BYF BOOM 内容管理后台</h1>
    <p>本地运营控制台 · 修改内容后点「生成网站」即刷新静态站</p>
    <label><span>管理密码</span><input type="password" id="pw" autocomplete="current-password" autofocus></label>
    <p class="err-msg" id="login-err"></p>
    <button class="btn primary" type="submit" style="width:100%">进入后台</button>
  </form>
</div>

<div class="shell hide" id="shell">
  <aside class="side">
    <div class="logo"><strong>BYF BOOM</strong><span>Content console</span></div>
    <nav id="nav">
      <button data-view="dashboard">运营总览</button>
      <button data-view="products">产品管理 <span class="pill" id="pill-products">0</span></button>
      <button data-view="categories">分类管理 <span class="pill" id="pill-categories">0</span></button>
      <button data-view="pages">页面 / 场景 <span class="pill" id="pill-pages">0</span></button>
      <button data-view="posts">内容文章 <span class="pill" id="pill-posts">0</span></button>
      <button data-view="inquiries">询价单 <span class="pill" id="pill-inquiries">0</span></button>
      <button data-view="faq">FAQ 交付包 <span class="pill" id="pill-faq">0</span></button>
      <button data-view="geo">SEO / GEO 检查</button>
      <button data-view="settings">站点设置</button>
      <button data-view="build">生成与发布</button>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank">预览网站</a>
      <a href="#" id="logout">退出</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="view-title">运营总览</h1><div class="sub" id="view-sub"></div></div>
      <div class="actions" id="view-actions"></div>
    </div>
    <div id="flash"></div>
    <div id="view"></div>
  </main>
</div>

<script>
(function () {
  var DB = { products: [], categories: [], pages: [], posts: [], inquiries: [], settings: {}, audit: null, contract: null, register: null, faqPending: [] };
  var view = "dashboard";
  var editing = null;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  function api(route, body) {
    return fetch("/admin/api/" + route, {
      method: body ? "POST" : "GET",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 401) { showLogin(); throw new Error("unauthorised"); }
      return r.json();
    });
  }

  function flash(msg, kind) {
    var el = $("#flash");
    el.innerHTML = msg ? '<div class="flash ' + (kind || "ok") + '">' + esc(msg) + "</div>" : "";
    if (msg) setTimeout(function () { if (el.textContent.indexOf(msg) !== -1) el.innerHTML = ""; }, 4000);
  }

  function showLogin() { $("#login").classList.remove("hide"); $("#shell").classList.add("hide"); }
  function showApp() { $("#login").classList.add("hide"); $("#shell").classList.remove("hide"); }

  /* ---------- login ---------- */
  $("#login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    $("#login-err").textContent = "";
    fetch("/admin/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#pw").value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) { showApp(); boot(); }
        else $("#login-err").textContent = res.j.error || "登录失败";
      });
  });
  $("#logout").addEventListener("click", function (e) {
    e.preventDefault();
    api("logout", {}).then(showLogin);
  });

  /* ---------- boot ---------- */
  function boot() {
    return api("bootstrap").then(function (d) {
      DB = d;
      $("#pill-products").textContent = d.products.length;
      $("#pill-categories").textContent = d.categories.length;
      $("#pill-pages").textContent = d.pages.length;
      $("#pill-posts").textContent = d.posts.length;
      $("#pill-inquiries").textContent = d.inquiries.length;
      $("#pill-faq").textContent = ((d.faqPending || {}).items || []).length;
      render();
    });
  }

  var META = {
    dashboard: ["运营总览", "内容健康度、SEO/GEO 状态与快捷操作"],
    products: ["产品管理", "产品资料、规格、阶梯价与页面 SEO"],
    categories: ["分类管理", "分类落地页内容与关键词"],
    pages: ["页面 / 场景", "行业场景页与静态页"],
    posts: ["内容文章", "GEO 收录用的指南文章"],
    inquiries: ["询价单", "网站提交的报价请求"],
    faq: ["FAQ 交付包", "起订量展示闸门、待确认事实与页型配额"],
    geo: ["SEO / GEO 检查", "机器可读性与结构化数据体检"],
    settings: ["站点设置", "品牌、联系方式、表单端点与统计"],
    build: ["生成与发布", "重新生成静态站并查看部署说明"]
  };

  function setView(v, payload) {
    view = v;
    if (payload !== undefined) editing = payload;
    $$("#nav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-view") === v); });
    $("#view-title").textContent = META[v][0];
    $("#view-sub").textContent = META[v][1];
    render();
  }

  $$("#nav button").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.getAttribute("data-view"), null); });
  });

  function render() {
    var el = $("#view"), act = $("#view-actions");
    act.innerHTML = "";
    if (view === "dashboard") return renderDashboard(el, act);
    if (view === "products") return renderProducts(el, act);
    if (view === "categories") return renderCategories(el, act);
    if (view === "pages") return renderPages(el, act);
    if (view === "posts") return renderPosts(el, act);
    if (view === "inquiries") return renderInquiries(el, act);
    if (view === "faq") return renderFaqPack(el, act);
    if (view === "geo") return renderGeo(el, act);
    if (view === "settings") return renderSettings(el, act);
    if (view === "build") return renderBuild(el, act);
  }

  /* ---------- dashboard ---------- */
  function renderDashboard(el, act) {
    var a = DB.audit;
    act.innerHTML = '<button class="btn primary" id="quick-build">生成网站</button>';
    $("#quick-build").addEventListener("click", function () { setView("build"); });
    var errs = a.issues.filter(function (i) { return i.level === "error"; }).length;
    var warns = a.issues.filter(function (i) { return i.level === "warn"; }).length;
    el.innerHTML =
      '<div class="grid g4" style="margin-bottom:18px">' +
        kpi(DB.products.length, "产品页面") + kpi(DB.categories.length, "分类落地页") +
        kpi(DB.posts.length, "GEO 指南文章") + kpi(DB.inquiries.length, "已收到询价单") +
      "</div>" +
      '<div class="grid g4" style="margin-bottom:18px">' +
        kpi(a.counts.faqs, "FAQ 条目（结构化问答）") + kpi(a.counts.tieredPrices, "阶梯价档位") +
        kpi(a.geo.sitemaps, "站点地图文件") + kpi(errs + warns, "待处理内容问题") +
      "</div>" +
      '<div class="panel"><h2>内容体检</h2>' +
        (a.issues.length
          ? '<ul class="issue-list">' + a.issues.slice(0, 40).map(function (i) {
              return '<li><span class="tag ' + (i.level === "error" ? "err" : i.level === "warn" ? "warn" : "info") + '">' + i.level + "</span><span>" + esc(i.area) + " <code>" + esc(i.item) + "</code></span></li>";
            }).join("") + "</ul>" + (a.issues.length > 40 ? '<p class="muted">另有 ' + (a.issues.length - 40) + " 条，见 SEO/GEO 检查页。</p>" : "")
          : '<p class="muted">未发现问题。</p>') +
      "</div>" +
      '<div class="panel"><h2>机器可读资产（GEO）</h2><table class="list"><tbody>' +
        row2("llms.txt", a.geo.llmsTxt) + row2("llms-full.txt（含全部产品与指南全文）", a.geo.llmsFullTxt) +
        row2("robots.txt（显式放行 AI 爬虫）", a.geo.robotsTxt) + row2("sitemap 文件数", a.geo.sitemaps) +
        row2("结构化数据类型", a.geo.jsonLdTypes.join("、")) +
        row2("静态站已生成", a.distBuilt ? "是" : "否 — 请到「生成与发布」执行") +
      "</tbody></table></div>";
  }
  function kpi(n, label) { return '<div class="kpi"><b>' + n + "</b><span>" + esc(label) + "</span></div>"; }
  function row2(k, v) {
    var val = typeof v === "boolean" ? '<span class="tag ' + (v ? "ok" : "err") + '">' + (v ? "已生成" : "缺失") + "</span>" : esc(v);
    return "<tr><th>" + esc(k) + "</th><td>" + val + "</td></tr>";
  }

  /* ---------- products ---------- */
  var pQuery = "";
  function renderProducts(el, act) {
    if (editing) return renderProductEditor(el, act);
    act.innerHTML = '<button class="btn primary" id="new-product">新增产品</button><button class="btn" id="build-now">生成网站</button>';
    $("#new-product").addEventListener("click", function () {
      editing = { slug: "", sku: "", name: "", category: DB.categories[0] ? DB.categories[0].slug : "", material: "Tritan copolyester", capacity: "", dimensions: "", unitWeight: "", carton: "", unitPrice: 0, tieredPrices: [], shortDescription: "", description: [""], features: [], applications: [], decorationOptions: [], packagingOptions: [], keywords: [], faqs: [], images: [], imageAlt: "", badges: [], featured: false, status: "published", seoTitle: "", seoDescription: "" };
      editing.__new = true;
      render();
    });
    $("#build-now").addEventListener("click", function () { setView("build"); });

    var list = DB.products.filter(function (p) {
      if (!pQuery) return true;
      var h = (p.name + " " + p.sku + " " + p.categoryName + " " + p.material).toLowerCase();
      return h.indexOf(pQuery.toLowerCase()) !== -1;
    });
    var catOpts = DB.categories.map(function (c) { return '<option value="' + c.slug + '">' + esc(c.name) + "</option>"; }).join("");
    el.innerHTML =
      '<input type="text" class="searchbox" id="pq" placeholder="搜索型号、名称、材质…" value="' + esc(pQuery) + '">' +
      '<div class="panel"><h2>' + list.length + ' 个产品</h2><table class="list">' +
      "<thead><tr><th>型号</th><th>名称</th><th>分类</th><th>报价方式</th><th>材质</th><th>内部参考单价</th><th>推荐</th><th></th></tr></thead><tbody>" +
      list.slice(0, 400).map(function (p) {
        return "<tr><td><code>" + esc(p.sku) + "</code></td><td>" + esc(p.name) + "</td><td>" + esc(p.categoryName || p.category) +
          '</td><td><span class="pill-mode">仅询价</span></td><td>' + esc(p.material) + '</td><td class="muted">$' + Number(p.unitPrice || 0).toFixed(2) + "</td><td>" + (p.featured ? "★" : "") +
          '</td><td class="actions-cell"><button class="btn sm" data-edit="' + esc(p.slug) + '">编辑</button> ' +
          '<button class="btn sm danger" data-del="' + esc(p.slug) + '">删除</button></td></tr>';
      }).join("") + "</tbody></table>" + (list.length > 400 ? '<p class="muted">仅显示前 400 条，请用搜索缩小范围。</p>' : "") + "</div>";

    $("#pq").addEventListener("input", function () { pQuery = this.value; render(); });
    $$("[data-edit]", el).forEach(function (b) {
      b.addEventListener("click", function () {
        var slug = b.getAttribute("data-edit");
        editing = JSON.parse(JSON.stringify(DB.products.filter(function (p) { return p.slug === slug; })[0]));
        render();
      });
    });
    $$("[data-del]", el).forEach(function (b) {
      b.addEventListener("click", function () {
        var slug = b.getAttribute("data-del");
        if (!confirm("确定删除产品 " + slug + "？此操作会直接写入数据文件。")) return;
        api("delete", { type: "products", slug: slug }).then(function () { flash("已删除 " + slug); return boot(); });
      });
    });
  }

  function tierRows(tiers) {
    var t = tiers && tiers.length ? tiers : [{ minQty: 1, unitPrice: 0, label: "" }, { minQty: 500, unitPrice: 0, label: "" }];
    return t.map(function (x, i) {
      return '<div class="row" data-tier="' + i + '">' +
        '<label class="f" style="flex:1;margin:0"><span>起订量</span><input type="number" data-t="minQty" value="' + (x.minQty || 1) + '"></label>' +
        '<label class="f" style="flex:1;margin:0"><span>单价 USD</span><input type="number" step="0.01" data-t="unitPrice" value="' + (x.unitPrice || 0) + '"></label>' +
        '<label class="f" style="flex:2;margin:0"><span>档位说明</span><input type="text" data-t="label" value="' + esc(x.label || "") + '"></label>' +
        '<button class="btn sm danger" type="button" data-rm-tier="' + i + '">删除</button></div>';
    }).join("");
  }

  function faqEditor(faqs) {
    return (faqs || []).map(function (f, i) {
      return '<div class="sectioncard" data-faq="' + i + '"><div class="sc-head"><span>问答 ' + (i + 1) + '</span><button class="btn sm danger" type="button" data-rm-faq="' + i + '">删除</button></div>' +
        '<label class="f"><span>问题</span><input type="text" data-f="q" value="' + esc(f.q) + '"></label>' +
        '<label class="f"><span>答案</span><textarea data-f="a" style="min-height:70px">' + esc(f.a) + "</textarea></label></div>";
    }).join("");
  }

  /* FAQ 交付包字段面板：MOQ 三种展示模式 / 阿里登记表绑定 / 装饰 / 理货。 */
  function contractPanel(p) {
    var c = DB.contract || {};
    var modes = c.moqDisplayModes || {};
    var mode = p.moq_display_mode || "quote_only";
    var entries = (DB.register && DB.register.entries) || [];
    var modeHints = {

      "</div>" +

      '<div class="panel"><h2>产品 FAQ <small>（会输出为 FAQPage 结构化数据，AI 搜索的重要入口）</small></h2>' +

      $("#faqs").insertAdjacentHTML("beforeend", faqEditor([{ q: "", a: "" }]));
    });
    el.addEventListener("click", function (e) {
      if (e.target.getAttribute("data-rm-tier") !== null && e.target.getAttribute("data-rm-tier") !== undefined) e.target.parentElement.remove();
      if (e.target.getAttribute("data-rm-faq") !== null && e.target.getAttribute("data-rm-faq") !== undefined) e.target.parentElement.remove();
    });
    var upd = function () {
      $("#c-title").textContent = $("#f-seoTitle").value.length;
      $("#c-desc").textContent = $("#f-seoDescription").value.length;
    };
    $("#f-seoTitle").addEventListener("input", upd);
    $("#f-seoDescription").addEventListener("input", upd);
    upd();

    // --- 产品图片：预览与上传 ---
    var imgLines = function () { return lines($("#f-images").value); };
    var refreshImgPreview = function () {
      var imgs = imgLines();
      $("#img-preview").innerHTML = imgs.length
        ? imgs.map(function (src, i) {
            return '<figure class="img-thumb' + (i === 0 ? " main" : "") + '"><img src="' + esc(src) + '" alt=""><figcaption>' + (i === 0 ? "主图" : i + 1) + "</figcaption></figure>";
          }).join("")
        : '<p style="color:#98a7b5;font-size:13px;margin:4px 0">暂无图片</p>';
    };
    $("#f-images").addEventListener("input", refreshImgPreview);
    refreshImgPreview();

    $("#f-imgfile").addEventListener("change", function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      if (!files.length) return;
      var base = slugify($("#f-slug").value.trim() || $("#f-sku").value.trim() || "product");
      var existing = imgLines();
      var counter = existing.filter(function (s) { return s.indexOf("/assets/img/products/" + base + "-") === 0; }).length + 1;
      var status = $("#img-status");
      var done = 0, ok = 0;
      var finishOne = function () {
        done++;
        status.textContent = "上传中… " + done + "/" + files.length;
        if (done === files.length) {
          status.textContent = "上传完成：" + ok + "/" + files.length + " 张成功" + (ok === files.length ? "" : "（失败请检查文件格式）");
          ev.target.value = "";
          refreshImgPreview();
        }
      };
      files.forEach(function (file) {
        var ext = (file.name.match(/\.(jpe?g|png|webp|avif|gif)$/i) || ["", ".jpg"])[1].toLowerCase();
        if (ext === "jpeg") ext = "jpg";
        var fname = base + "-" + (counter < 10 ? "0" + counter : counter) + ext;
        counter++;
        fetch("/admin/api/upload-image?filename=" + encodeURIComponent(fname), {
          method: "POST",
          headers: { "Content-Type": file.type || "application/octet-stream" },
          body: file
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.ok && j.path && imgLines().indexOf(j.path) === -1) {
            $("#f-images").value = ($("#f-images").value.replace(/\s+$/, "") + "\n" + j.path).trim();
            ok++;
          }
          finishOne();
        }).catch(function () { finishOne(); });
      });
    });
  }

  function field(label, input) { return '<label class="f"><span>' + label + "</span>" + input + "</label>"; }

  function lines(v) { return v.split("\n").map(function (s) { return s.trim(); }).filter(Boolean); }

  function saveProduct() {
    var p = editing;
    var catSlug = $("#f-category").value;
    var cat = DB.categories.filter(function (c) { return c.slug === catSlug; })[0] || {};
    var tiers = $$("#tiers .row").map(function (r) {
      return {
        minQty: Number($('[data-t="minQty"]', r).value) || 1,
        unitPrice: Number($('[data-t="unitPrice"]', r).value) || 0,
        label: $('[data-t="label"]', r).value
      };
    }).filter(function (t) { return t.unitPrice > 0; });
    var faqs = $$("#faqs .sectioncard").map(function (c) {
      return { q: $("[data-f=q]", c).value.trim(), a: $("[data-f=a]", c).value.trim() };
    }).filter(function (f) { return f.q && f.a; });

    // Pricing is quotation-only sitewide, so the mode is fixed and no MOQ field
    // is written. tieredPrices and the base unit cost stay internal.
    var pricingMode = "quoteOnly";
    var prices = tiers.map(function (t) { return t.unitPrice; }).filter(function (n) { return n > 0; });
    var modeLabels = { quoteOnly: "Quotation only" };
    var defaultNotes = {
      quoteOnly: "Priced per project. Logo, colour, packaging, set contents, battery format and plug standard are all configurable on our own tooling, so the unit price is quoted against your confirmed specification. OEM and ODM projects are welcome — send a drawing, a reference sample or a target cost and we return a firm quotation."
    };

    var item = {
      sku: $("#f-sku").value.trim(),
      slug: ($("#f-slug").value.trim() || slugify($("#f-sku").value + "-" + $("#f-name").value)),
      name: $("#f-name").value.trim(),
      category: catSlug,
      categoryName: cat.name || catSlug,
      material: $("#f-material").value.trim(),
      capacity: $("#f-capacity").value.trim(),
      dimensions: $("#f-dimensions").value.trim(),
      unitWeight: $("#f-unitWeight").value.trim(),
      carton: $("#f-carton").value.trim(),
      unitPrice: Number($("#f-unitPrice").value) || 0,
      pricingMode: pricingMode,
      pricingLabel: modeLabels[pricingMode],
      pricingNote: $("#f-pricingNote").value.trim() || defaultNotes[pricingMode],
      priceFrom: prices.length ? Math.min.apply(null, prices) : 0,
      priceHigh: prices.length ? Math.max.apply(null, prices) : 0,
      // No moqQty is written: a price tier is not an MOQ, and the public MOQ
      // comes from standard_moq + the Alibaba register only.
      moqQty: null,
      priceOnRequest: true,
      tieredPrices: tiers,
      leadTime: $("#f-leadTime").value.trim(),
      paymentTerms: $("#f-paymentTerms").value.trim(),
      featured: $("#f-featured").checked,
      shortDescription: $("#f-shortDescription").value.trim(),
      description: $("#f-description").value.split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean),
      features: lines($("#f-features").value),
      applications: lines($("#f-applications").value),
      seoTitle: $("#f-seoTitle").value.trim(),
      seoDescription: $("#f-seoDescription").value.trim(),
      imageAlt: $("#f-imageAlt").value.trim(),
      images: lines($("#f-images").value),
      keywords: lines($("#f-keywords").value),
      faqs: faqs,
      decorationOptions: p.decorationOptions || [],
      packagingOptions: p.packagingOptions || [],
      badges: p.badges || [],
      status: "published",
      // --- FAQ 交付包字段 ---
      moq_display_mode: $("#f-moq_display_mode").value,
      standard_moq: Number($("#f-standard_moq").value) || null,
      decoration_moq: Number($("#f-decoration_moq").value) || null,
      gift_box_moq: Number($("#f-gift_box_moq").value) || null,
      alibaba_listing_key: $("#f-alibaba_listing_key").value,
      alibaba_moq_verified_date: $("#f-alibaba_moq_verified_date").value,
      inventory_status: $("#f-inventory_status").value,
      order_quantity_band: $("#f-order_quantity_band").value,
      product_family: $("#f-product_family").value,
      decoration_methods: lines($("#f-decoration_methods").value),
      logo_positions: lines($("#f-logo_positions").value),
      available_gift_sets: lines($("#f-available_gift_sets").value),
      sample_policy: $("#f-sample_policy").value.trim(),
      care_instructions: $("#f-care_instructions").value.trim(),
      quality_control_record: $("#f-quality_control_record").value.trim(),
      standard_packaging: $("#f-standard_packaging").value.trim(),
      last_verified_date: $("#f-last_verified_date").value
    };
    if (!item.sku || !item.name) return flash("型号和名称必填", "err");

    // 交付包硬规则：published_verified 必须同时具备登记表条目、标准起订量和核验日期。
    if (item.moq_display_mode === "published_verified") {
      if (!item.alibaba_listing_key) return flash("published_verified 必须先绑定阿里登记表条目", "err");
      if (!item.standard_moq) return flash("published_verified 必须填写标准起订量", "err");
      if (!item.alibaba_moq_verified_date) return flash("published_verified 必须填写起订量核验日期", "err");
    }

    api("data", { type: "products", item: item, originalSlug: p.__new ? null : p.slug }).then(function () {
      flash("已保存 " + item.sku + "（记得点「生成网站」刷新静态站）");
      editing = null;
      return boot();
    });
  }

  function slugify(s) {
    return String(s).toLowerCase().replace(/[®™]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").replace(/-+/g, "-");
  }

  /* ---------- pages ---------- */

      "首页": [4, 5], "类目页": [5, 8], "SKU 页": [6, 10], "指南页": [6, 10], "行业页": [5, 8]
    };

        defaultSeoDescription: $("#s-desc").value.trim(),
        heroTitle: $("#s-heroTitle").value.trim(),
        heroSubtitle: $("#s-heroSub").value.trim(),
        announcement: $("#s-announce").value.trim(),
        formEndpoint: $("#s-form").value.trim(),
        adminPassword: $("#s-pw").value.trim() || s.adminPassword,
        analytics: { provider: $("#s-analytics-provider").value, id: $("#s-analytics-id").value.trim() },
        social: {
          linkedin: $("#s-linkedin").value.trim(), instagram: $("#s-instagram").value.trim(),
          facebook: $("#s-facebook").value.trim(), youtube: $("#s-youtube").value.trim(), alibaba: $("#s-alibaba").value.trim(),
          tiktok: $("#s-tiktok").value.trim(), tiktokVideo: $("#s-tiktokVideo").value.trim()
        },
        geoFacts: lines($("#s-geoFacts").value),
        quoteTerms: lines($("#s-quoteTerms").value)
      };
      api("settings", patch).then(function () { flash("设置已保存"); return boot(); });
    });

    el.innerHTML =
      '<div class="panel"><h2>品牌与联系</h2><div class="grid g2">' +
      field("品牌名", '<input type="text" id="s-brand" value="' + esc(s.brand) + '">') +
      field("域名 <small>（必须与线上正式域名一致，影响 canonical / sitemap / 结构化数据）</small>", '<input type="text" id="s-domain" value="' + esc(s.domain) + '">') +
      field("一句话定位", '<input type="text" id="s-tagline" value="' + esc(s.tagline) + '">') +
      field("主邮箱", '<input type="text" id="s-email" value="' + esc(s.email) + '">') +
      field("销售邮箱", '<input type="text" id="s-salesEmail" value="' + esc(s.salesEmail) + '">') +
      field("样品邮箱", '<input type="text" id="s-sampleEmail" value="' + esc(s.sampleEmail) + '">') +
      field("电话", '<input type="text" id="s-phone" value="' + esc(s.phone) + '">') +
      field("WhatsApp", '<input type="text" id="s-whatsapp" value="' + esc(s.whatsapp) + '">') +
      field("工作时间", '<input type="text" id="s-hours" value="' + esc(s.hours) + '">') +
      field("地址（简短）", '<input type="text" id="s-addressShort" value="' + esc(s.addressShort) + '">') +
      field("地址（完整）", '<input type="text" id="s-address" value="' + esc(s.addressFull) + '">') +
      "</div></div>" +

      '<div class="panel"><h2>首页文案</h2>' +
      field("顶部公告条", '<input type="text" id="s-announce" value="' + esc(s.announcement) + '">') +
      field("主标题", '<input type="text" id="s-heroTitle" value="' + esc(s.heroTitle) + '">') +
      field("副标题", '<textarea id="s-heroSub">' + esc(s.heroSubtitle) + "</textarea>") +
      field("默认 meta 描述 <small>（≤158 字符）</small>", '<textarea id="s-desc">' + esc(s.defaultSeoDescription) + "</textarea>") +
      "</div>" +

      '<div class="panel"><h2>表单与统计</h2>' +
      '<div class="warnbox">询价表单接收端点：纯静态站没有后端。填入第三方表单服务地址（Formspree、Web3Forms、Basin 等）即可收到邮件通知；留空则买家提交时自动生成预填好的邮件草稿。若把站点部署在 VPS 上并运行本后台服务，可填 <code>https://你的域名/api/inquiry</code>，询价单会直接落到「询价单」列表里。</div>' +
      field("表单端点 URL", '<input type="text" id="s-form" placeholder="https://formspree.io/f/xxxxxxx" value="' + esc(s.formEndpoint) + '">') +
      '<div class="grid g2">' +
      field("统计服务", '<select id="s-analytics-provider"><option value=""' + (!s.analytics.provider ? " selected" : "") + '>不启用</option><option value="plausible"' + (s.analytics.provider === "plausible" ? " selected" : "") + ">Plausible</option></select>") +
      field("统计 ID / 域名", '<input type="text" id="s-analytics-id" value="' + esc(s.analytics.id || "") + '">') +
      "</div></div>" +

      '<div class="panel"><h2>社交资料 <small>（会写入 Organization 结构化数据的 sameAs，增强 AI 与搜索引擎的实体识别）</small></h2><div class="grid g2">' +
      field("LinkedIn", '<input type="text" id="s-linkedin" value="' + esc(s.social.linkedin || "") + '">') +
      field("Instagram", '<input type="text" id="s-instagram" value="' + esc(s.social.instagram || "") + '">') +
      field("Facebook", '<input type="text" id="s-facebook" value="' + esc(s.social.facebook || "") + '">') +
      field("YouTube", '<input type="text" id="s-youtube" value="' + esc(s.social.youtube || "") + '">') +
      field("阿里国际站店铺", '<input type="text" id="s-alibaba" value="' + esc(s.social.alibaba || "") + '">') +
      field("TikTok 主页 <small>（@用户名或主页链接，显示为窗口标题）</small>", '<input type="text" id="s-tiktok" value="' + esc(s.social.tiktok || "") + '">') +
      field("TikTok 视频链接 <small>（粘贴单条视频链接，如 tiktok.com/@xxx/video/123…，首页右侧 16:9 播放）</small>", '<input type="text" id="s-tiktokVideo" value="' + esc(s.social.tiktokVideo || "") + '">') +
      "</div></div>" +

      '<div class="panel"><h2>GEO 事实清单 <small>（写入 llms.txt，供 AI 直接引用）</small></h2>' +
      field("每行一条事实", '<textarea id="s-geoFacts" style="min-height:150px">' + esc((s.geoFacts || []).join("\n")) + "</textarea>") +
      "</div>" +

      '<div class="panel"><h2>报价条款 <small>（写入 llms.txt 与询价页）</small></h2>' +
      field("每行一条", '<textarea id="s-quoteTerms" style="min-height:110px">' + esc((s.quoteTerms || []).join("\n")) + "</textarea>") +
      "</div>" +

      '<div class="panel"><h2>后台密码</h2>' +
      field("管理密码 <small>（留空表示不修改）</small>", '<input type="text" id="s-pw" placeholder="' + esc(s.adminPassword) + '">') +
      "</div>";
  }

  /* ---------- build ---------- */
  function renderBuild(el, act) {
    act.innerHTML = '<button class="btn primary" id="do-build">重新生成网站</button><a class="btn" href="/" target="_blank">打开预览</a>';
    $("#do-build").addEventListener("click", function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = "生成中…";
      api("build", {}).then(function (r) {
        btn.disabled = false;
        btn.textContent = "重新生成网站";
        $("#out").innerHTML = "<pre class='out'>" + esc(r.out) + "</pre>";
        flash(r.code === 0 ? "生成完成" : "生成失败，请看输出", r.code === 0 ? "ok" : "err");
        return boot();
      });
    });
    el.innerHTML =
      '<div class="panel"><h2>生成结果</h2><div id="out"><p class="muted">点击右上角「重新生成网站」后，这里会显示构建输出。</p></div></div>' +
      '<div class="panel"><h2>发布说明</h2>' +
      '<p>构建产物在项目目录的 <code>dist/</code>，是一套纯静态文件（HTML + CSS + 图片 + sitemap + llms.txt），没有任何后端依赖。</p>' +
      '<p><strong>部署方式（任选）：</strong></p><ul class="issue-list" style="list-style:disc;padding-left:20px">' +
      "<li>拖拽 <code>dist/</code> 目录到 Netlify / Cloudflare Pages / Vercel，绑定域名即可（<code>_headers</code> 与 <code>_redirects</code> 会被自动识别）。</li>" +
      "<li>上传到自己的 VPS，用 Nginx 指向 <code>dist/</code>，并配置 <code>try_files $uri $uri/ $uri/index.html =404</code>。</li>" +
      "<li>同步到对象存储（S3 / COS / OSS）并开启静态网站托管。</li></ul>" +
      '<p><strong>发布后必做三件事：</strong></p><ol style="padding-left:20px">' +
      "<li>到「站点设置」把域名改成正式域名，再重新生成一次（canonical、sitemap、结构化数据都依赖它）。</li>" +
      "<li>把 <code>/sitemap.xml</code> 提交到 Google Search Console 与 Bing Webmaster Tools。</li>" +
      "<li>配置表单端点，做一次真实的询价单提交测试。</li></ol>" +
      '<p class="muted">注意：本后台服务仅用于本地内容管理与预览，不需要部署到线上。上线只发布 <code>dist/</code>。</p>' +
      "</div>";
  }

  /* ---------- start ---------- */
  api("session").then(function (s) {
    if (s.authed) { showApp(); boot(); }
    else showLogin();
  });
})();
</script>
</body>
</html>
