<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>内容管理 · BOOM Drinkware</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;background:#f4f4ef;color:#182b28}header{padding:18px 28px;background:#173d35;color:white;display:flex;gap:20px;align-items:center;justify-content:space-between}header strong{font-size:21px;letter-spacing:.05em}button,a.login{font:inherit;cursor:pointer;border:1px solid #a5b8ae;border-radius:6px;background:white;color:#173d35;padding:9px 14px}button.primary{background:#cfec78;color:#173d35;border-color:#cfec78}button:disabled{opacity:.4;cursor:wait}main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 76px)}aside{padding:24px;border-right:1px solid #d1d8cf}h1{font-size:23px;margin:0 0 8px}h2{font-size:16px;margin:24px 0 10px}p{color:#50635a}label{display:block;font-weight:600;margin-top:16px}input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid #a5b8ae;background:#fff;border-radius:5px}textarea{min-height:125px;resize:vertical}button{margin:8px 4px 0 0}iframe{border:0;width:100%;height:calc(100vh - 76px);background:white}#status{margin:0;padding:10px 28px;background:#e5eadf;white-space:pre-wrap}#selected{word-break:break-word}#count{font-size:13px}ul{padding-left:18px}li{margin:6px 0}.notice{padding:32px;max-width:680px;margin:auto}a{color:inherit}#history button{display:block;width:100%;text-align:left}input[type=file]{font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid #a7cb36;outline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0}iframe{height:65vh}header{padding:16px;flex-wrap:wrap}}header{height:72px}#editor{grid-template-columns:250px minmax(0,1fr) 310px;min-height:0;height:calc(100vh - 115px)}#editor>aside{grid-column:3;grid-row:1;overflow:auto;background:white;border-left:1px solid #ddd;padding:20px}#preview{grid-column:2;grid-row:1;height:100%;min-width:0}#visual-nav{grid-column:1;grid-row:1;padding:16px;overflow:auto;background:#fafbf8;border-right:1px solid #d7ded8}#visual-nav button{display:block;width:100%;text-align:left;margin:3px 0;font-size:13px;border:0;background:transparent}#visual-nav button.active{background:#dce9df;font-weight:700}#visual-nav input{font-size:13px}#visual-nav h2{margin:16px 0 8px}#page-list{max-height:38vh;overflow:auto}#section-list button{border-left:2px solid #c7d5c9;border-radius:0}#visual-mode{display:flex;gap:6px}#visual-mode button{width:auto}#preview.mobile{max-width:390px;justify-self:center}#editor>aside>h1{font-size:20px}#page,#open,label[for=page]{display:none}#visual-current{font-size:12px;word-break:break-all}#visual-nav small{color:#5b6b62}@media(max-width:1000px){#editor{grid-template-columns:210px minmax(0,1fr)}#editor>aside{grid-column:1;grid-row:2}#visual-nav{grid-column:1;grid-row:1}#preview{grid-column:2;grid-row:1 / span 2;min-height:75vh}#editor{height:auto}}@media(max-width:650px){#editor{display:flex;flex-direction:column;height:auto}#preview{height:60vh}#page-list{max-height:22vh}} </style>
<header><strong>BOOM <span style="font-weight:400">内容工作台</span></strong><span id="account"></span></header><p id="status" role="status">正在检查登录…</p>
<div id="login" class="notice" hidden><h1>管理你的网站内容</h1><p>使用获授权的 GitHub 账号登录，修改页面文字、按钮文案和图片。</p><a class="login" href="/api/cms/auth/start">使用 GitHub 登录</a></div>
<main id="editor" hidden><aside><h1>页面编辑</h1><p>打开页面后，点击右侧的文字或图片进行修改。中英文页面分别编辑。</p><label for="page">页面地址</label><input id="page" value="/" placeholder="/oem-manufacturer/"><button id="open">打开页面</button><h2>选中的内容</h2><p id="selected">请在页面中点击文字或图片</p><label for="value">替换文字 / 图片地址</label><textarea id="value"></textarea><label for="upload">上传替换图片（JPG、PNG、WebP，最多 512 KB）</label><input id="upload" type="file" accept="image/jpeg,image/png,image/webp"><button id="apply">应用到预览</button><h2>草稿与发布</h2><p id="count"></p><button id="save">保存草稿</button><button id="publish" class="primary">发布到网站</button><button id="live">查看正式页面</button><p>预览和草稿不会改变正式页面。发布后，相同的完整文字在本页出现多次时会一并替换。导航文字按当前页面保存。</p><h2>发布历史</h2><button id="versions">刷新历史</button><div id="history"></div><button id="logout">退出登录</button></aside><iframe id="preview" title="网站内容预览" sandbox="allow-scripts allow-same-origin"></iframe></main>
