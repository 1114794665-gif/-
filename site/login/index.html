<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=20261106-boom" />
  <title>Staff Sign In · BOOM Drinkware Console</title>
  <meta name="robots" content="noindex, nofollow" />
  
  
  <link href="/assets/fonts-latin-20261029.css" rel="stylesheet">
  <style>
    :root{
      --bg:#F7F3EC; --white:#ffffff; --ink:#1f2937; --ink-soft:#6b7280;
      --border:#e5e0d8; --sand:#f5f0e8; --terra:#c2410c; --terra-hover:#9a3412;
      --terra-soft:#fde8e1; --terra-hover-text:#7c2d12;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Manrope','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;}
    .card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:32px;}
    .head{text-align:center;}
    .badge{width:48px;height:48px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--terra-soft);}
    .badge svg{width:24px;height:24px;color:var(--terra);}
    h1{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0;}
    .sub{margin:6px 0 0;font-size:12px;color:var(--ink-soft);}
    form{margin-top:24px;display:flex;flex-direction:column;gap:16px;}
    .field{position:relative;}
    .field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(107,114,128,.5);}
    input{width:100%;padding:12px 14px 12px 38px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--sand);outline:none;transition:border-color .15s,box-shadow .15s;color:var(--ink);}
    input:focus{border-color:rgba(194,65,12,.5);box-shadow:0 0 0 3px rgba(194,65,12,.12);background:#fff;}
    button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--terra);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit;}
    button:hover{background:var(--terra-hover);}
    button:disabled{opacity:.6;cursor:not-allowed;}
    .alert{margin:0;padding:10px 12px;border-radius:10px;border:1px solid rgba(194,65,12,.4);background:rgba(253,232,225,.6);font-size:12px;font-weight:600;line-height:1.5;color:var(--terra-hover-text);}
    .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-soft);}
  </style>
<link rel="stylesheet" data-whole-repair-css="1" href="/assets/whole-repair-20261026.css"><link rel="stylesheet" href="/assets/fast-sample-20261031.css?v=20261031d">
<link rel="stylesheet" href="/assets/factory-specialist-20261103.css"><link rel="stylesheet" href="/assets/brand-boom-20261106.css">
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M12 12v4"/></svg>
      </div>
      <h1>BOOM Drinkware Staff Console</h1>
      <p class="sub">员工登录 · 用户名 + 密码</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="username" type="text" placeholder="Username 用户名" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" type="password" placeholder="Password 密码" autocomplete="current-password" />
      </div>
      <div id="error" class="alert" style="display:none" role="alert"></div>
      <button id="submitBtn" type="submit">Sign In 登录</button>
    </form>
    <div class="foot">初始账号 admin / 建议登录后在后台修改密码</div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    function showError(msg){ errorEl.textContent = msg; errorEl.style.display = 'block'; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showError('请输入用户名和密码。'); return; }
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        // tRPC + superjson：body = { json: superjson.serialize(input) }
        // 纯字符串对象的 superjson.serialize 结果为 { json: input }，故整体为双 json 包裹
        const input = { username: username.toLowerCase(), password: password };
        const resp = await fetch('/api/trpc/auth.loginLocal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ json: { json: input } })
        });
        const data = await resp.json();
        if (data && data.error) { showError(data.error.message || '登录失败。'); btn.disabled = false; btn.textContent = 'Sign In 登录'; return; }
        if (!data || !data.result || !data.result.data) { showError('登录失败：返回格式异常。'); btn.disabled = false; btn.textContent = 'Sign In 登录'; return; }
        window.location.href = '/admin/';
      } catch (err) {
        showError('网络错误，请稍后重试。');
        btn.disabled = false; btn.textContent = 'Sign In 登录';
      }
    });
  </script>

</html>
